# My own compose file for labApi (Wednesday, tasks 1-2 and 5), written before
# comparing with the fasit. Copy it into the labApi folder after renaming the
# original to compose.fasit.yml. Values come from .env (never committed).
name: labapi

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports: only containers on the compose network can reach the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      MIGRATE_ON_STARTUP: "true"
      # Host=db: the service name is the hostname on the compose network
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Task 5 (optional): GUI for looking, not clicking. Starts only with --profile tools.
  pgadmin:
    image: docker.io/dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"

volumes:
  postgres_data:
